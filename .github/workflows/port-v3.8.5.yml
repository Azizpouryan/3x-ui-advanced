name: Port admin fork to upstream v3.8.5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-v3-8-5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  port-and-test:
    # Start this workflow from upgrade/v3.8.5-preserve-admin in the Actions UI.
    if: startsWith(github.ref, 'refs/heads/upgrade/v3.8.5-preserve-admin')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the selected upgrade branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch official baseline and target tags
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/MHSanaei/3x-ui.git \
            refs/tags/v3.6.0:refs/tags/port-base-v3.6.0 \
            refs/tags/v3.8.5:refs/tags/port-target-v3.8.5
          git show -s --format='%H %s' refs/tags/port-base-v3.6.0
          git show -s --format='%H %s' refs/tags/port-target-v3.8.5

      - name: Prepare three-way migration candidate
        run: python3 tools/port-v3.8.5.py

      - name: Commit candidate for review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Port admin fork onto upstream v3.8.5"
            git push origin HEAD:upgrade/v3.8.5-preserve-admin
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check installer shell syntax
        run: |
          set -euo pipefail
          for file in install.sh update.sh x-ui.sh install_offline.sh; do
            if [ -f "$file" ]; then bash -n "$file"; fi
          done

      - name: Run Go tests
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Build Linux panel binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/x-ui-v3.8.5 .

      - name: Package tested binary with official v3.8.5 runtime assets
        run: |
          set -euo pipefail
          work=/tmp/three-x-ui-v385
          rm -rf "$work"
          mkdir -p "$work"
          curl -fsSL --retry 5 -o "$work/x-ui-linux-amd64.tar.gz" \
            https://github.com/MHSanaei/3x-ui/releases/download/v3.8.5/x-ui-linux-amd64.tar.gz
          curl -fsSL --retry 5 -o "$work/x-ui-linux-amd64.tar.gz.sha256" \
            https://github.com/MHSanaei/3x-ui/releases/download/v3.8.5/x-ui-linux-amd64.tar.gz.sha256
          (cd "$work" && sha256sum -c x-ui-linux-amd64.tar.gz.sha256)
          mkdir -p "$work/unpacked"
          tar -xzf "$work/x-ui-linux-amd64.tar.gz" -C "$work/unpacked"
          test -d "$work/unpacked/x-ui"
          install -m 0755 /tmp/x-ui-v3.8.5 "$work/unpacked/x-ui/x-ui"
          install -m 0755 x-ui.sh "$work/unpacked/x-ui/x-ui.sh"
          for file in x-ui.service.debian x-ui.service.arch x-ui.service.rhel x-ui.rc; do
            if [ -f "$file" ]; then cp "$file" "$work/unpacked/x-ui/"; fi
          done
          tar -czf x-ui-linux-amd64.tar.gz -C "$work/unpacked" x-ui
          sha256sum x-ui-linux-amd64.tar.gz > x-ui-linux-amd64.tar.gz.sha256

          mkdir -p offline
          cp x-ui-linux-amd64.tar.gz offline/x-ui-linux-amd64.tar.gz
          sha256sum offline/x-ui-linux-amd64.tar.gz > offline/x-ui-linux-amd64.tar.gz.sha256
          python3 - <<'PY'
          from pathlib import Path
          p = Path("offline/README.md")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              s = s.replace("v3.4.4 + RBAC fork", "v3.8.5 + RBAC fork")
              s = s.replace("Xray-core v26.7.28", "Xray-core from the official v3.8.5 bundle")
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit refreshed offline bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/x-ui-linux-amd64.tar.gz offline/x-ui-linux-amd64.tar.gz.sha256 offline/README.md
          if git diff --cached --quiet; then
            echo "Offline bundle did not change."
          else
            git commit -m "Refresh offline bundle for v3.8.5"
            git push origin HEAD:upgrade/v3.8.5-preserve-admin
          fi

      - name: Upload migration and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-v3.8.5-artifacts
          path: |
            PORTING_REPORT_v3.8.5.md
            x-ui-linux-amd64.tar.gz
            x-ui-linux-amd64.tar.gz.sha256
          if-no-files-found: warn
